# Packages these dotfiles and my apps need on CachyOS, plus the services and
# groups they need. run_onchange_before_install-packages sets up whatever is
# missing, and reruns whenever this file changes.
packages:
  repo:
    # Desktop
    - hyprland
    - xdg-desktop-portal-hyprland
    - xdg-desktop-portal-gtk # file-open dialogs, which Hyprland's portal lacks
    - quickshell
    - dunst
    - rofi
    - alacritty
    - swaybg
    - hyprshot
    - polkit-gnome
    - pavucontrol
    - nautilus
    - ttf-jetbrains-mono-nerd
    - noto-fonts
    - noto-fonts-emoji
    - noto-fonts-cjk
    - papirus-icon-theme
    # Login screen
    - greetd
    - greetd-tuigreet
    # Bar widgets (see ~/.config/quickshell/bar/README.md) and volume keys
    - pipewire
    - pipewire-pulse
    - wireplumber
    - libpulse
    - bluez
    - bluez-utils
    - networkmanager
    - upower
    - tuned-ppd # power profiles; replaces power-profiles-daemon
    - imagemagick
    - curl
    - pacman-contrib
    # Shell
    - fish
    - cachyos-fish-config
    - starship
    - zsh
    - tmux
    - openssh
    - mise
    - bun
    # Neovim, plus what treesitter, telescope and Mason's tools need
    - neovim
    - git
    - base-devel
    - tree-sitter-cli
    - ripgrep
    - fd
    - unzip
    - nodejs
    - npm
    - go
    - python
    # Development
    - docker
    - github-cli
    - claude-code
    - openai-codex
    - opencode
    - uv
    - pnpm
    - yarn
    - aws-cli-v2
    - terraform
    # Apps
    - helium-browser-bin
    - firefox
    - keepassxc
    - telegram-desktop
    - vesktop-bin
    - chatgpt-desktop-bin
    - calibre
    - zathura
    - zathura-pdf-mupdf
    - yazi
    - btop
    # VPNs
    - tailscale
    - mullvad-vpn
    # Command-line tools
    - tree
    - bc
    - strace
    - traceroute
    - wev
    # AUR helper for the list below
    - paru
  aur:
    - tinty-git
    - light # brightness keys
    - zoom
    - spotify
    - ledger-live-bin
    - ledger-udev
    - nordvpn-bin
    - t3code-bin
  # Enabled and started if they aren't already. tuned-ppd starts tuned itself;
  # nordvpnd stays off, started by hand.
  services:
    - docker.service
    - tailscaled.service
    - mullvad-daemon.service
    - tuned-ppd.service
  # Groups to add me to, so docker and nordvpn work without sudo.
  groups:
    - docker
    - nordvpn
