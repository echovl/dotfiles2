[general]
import = ["~/.config/alacritty/colors.toml"]

[font]
size = 10.5

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[window.padding]
x = 10
y = 0

[window]
decorations_theme_variant = "Dark"

# Scroll speed comes from the alacritty-scroll rule in hyprland.lua.
[scrolling]
multiplier = 1

[keyboard]
bindings = [
  { key = "Key6", mods = "Control", chars = "\u001e" }
]

