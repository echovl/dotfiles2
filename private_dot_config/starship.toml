"$schema" = 'https://starship.rs/config-schema.json'

# The most a module may spend running a command (Omarchy's value; the default
# is 500 ms).
command_timeout = 200

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$rust\
$golang\
$nodejs\
$character"""

[username]
show_always = true

[directory]
style = "blue"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"

# Language modules show only the project's icon. A version means running the
# toolchain (rustc, node, go) at every prompt in a project, and nodejs runs
# `node --version` for its engines check whenever the format uses $style, so
# the color is spelled out.
[nodejs]
format = "via [$symbol](bright-black)"

[rust]
format = "via [$symbol](bright-black)"

[golang]
format = "via [$symbol](bright-black)"

[line_break]
disabled = false
